name: Release

# A tag v<version> builds the desktop app for every platform, signs its
# updates, pushes the server's image for amd64 and arm64 to
# ghcr.io/fzn0x/nether-server, and publishes the release: the installers
# and packages, the archives and manifests installed apps update from, and
# SHA256SUMS. The release is the repository's latest, which installed apps
# read their updates from (releases/latest/download), so it is never a
# draft or a prerelease.
#
# Run by hand on a branch, it is a dry run: every job builds, the APK and
# the updates are signed, the chart is packaged and the notes rendered,
# but nothing is pushed or published. Run it on main before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the app's version, and the changelog has its section
        run: |
          version="$(jq -r .version apps/desktop/mygo.json)"
          # A dry run has no tag: it checks the rest.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "The tag $GITHUB_REF_NAME is not v$version, the version in apps/desktop/mygo.json."
              exit 1
            }
          fi
          server="$(jq -r .version apps/server/package.json)"
          test "$server" = "$version" || {
            echo "apps/server/package.json is at $server, not $version: /health would report it."
            exit 1
          }
          clipper="$(jq -r .version apps/clipper/package.json)"
          test "$clipper" = "$version" || {
            echo "apps/clipper/package.json is at $clipper, not $version: its ZIPs and manifests are named by it."
            exit 1
          }
          mobile="$(jq -r .version apps/mobile/package.json)"
          test "$mobile" = "$version" || {
            echo "apps/mobile/package.json is at $mobile, not $version: the Android app's version and code come from it."
            exit 1
          }
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version."
            exit 1
          }

  desktop:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest, platform: linux/amd64 }
          - { name: windows-amd64, os: ubuntu-latest, platform: windows/amd64 }
          # On macOS, as the disk image needs it.
          - { name: darwin-universal, os: macos-latest, platform: darwin/universal }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'windows-amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # The builds are not code signed yet: Windows warns of an unknown
      # publisher, and macOS asks to open the app from its settings. Their
      # updates are signed, which installed apps check.
      - name: Build, with its updates signed
        working-directory: apps/desktop
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || {
            echo "MYGO_UPDATER_PRIVATE_KEY is not set: installed apps could not update to this release."
            exit 1
          }
          go tool mygo build -platform "${{ matrix.platform }}"
      - name: The release's files, in lowercase
        working-directory: apps/desktop/build/${{ matrix.name }}
        run: |
          version="$(jq -r .version ../../mygo.json)"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          # Archives, deltas and manifests keep their names: the manifests name them.
          for file in *.tar.gz *.delta *.deb install.sh update-*.json; do
            if [ -e "$file" ]; then cp "$file" "$out/"; fi
          done
          for file in *Setup*.exe; do
            if [ -e "$file" ]; then cp "$file" "$out/nether-$version-windows-amd64-setup.exe"; fi
          done
          for file in *.dmg; do
            if [ -e "$file" ]; then cp "$file" "$out/nether-$version-darwin-universal.dmg"; fi
          done
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release/
      - name: Keep the Linux build for the AppImage and the Flatpak
        if: matrix.name == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-amd64
          path: apps/desktop/build/
          retention-days: 1

  appimage:
    name: AppImage
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-linux-amd64
          path: apps/desktop/build
      - name: Fetch appimagetool 1.9.1
        run: |
          curl -fsSLo /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
      - name: Build the AppImage
        working-directory: apps/desktop
        run: |
          sh packaging/appimage.sh build/linux-amd64 /tmp/appimagetool
          version="$(jq -r .version mygo.json)"
          mkdir -p "$RUNNER_TEMP/release"
          mv build/linux-amd64/*.AppImage "$RUNNER_TEMP/release/nether-$version-x86_64.appimage"
      - uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: ${{ runner.temp }}/release/

  flatpak:
    name: Flatpak
    needs: desktop
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-linux-amd64
          path: apps/desktop/build
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nether.flatpak
          manifest-path: apps/desktop/packaging/flatpak/io.github.fzn0x.Nether.yml
          cache: false
          upload-artifact: false
      - name: Name the bundle
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' apps/desktop/mygo.json)"
          mkdir -p release
          mv nether.flatpak "release/nether-$version-x86_64.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: release/

  # The image docker compose pulls (deploy/docker), tagged with the version,
  # its minor line and latest.
  server:
    name: Server image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fzn0x/nether-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build it, and push it on a tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    name: Helm chart
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1
      - name: Package it at the release's version
        run: |
          version="$(jq -r .version apps/desktop/mygo.json)"
          helm package deploy/helm/nether --version "$version" --app-version "$version" --destination dist
          # The packaged chart renders, as a one-node install would have it.
          helm template nether "dist/nether-$version.tgz" -f deploy/helm/nether/examples/one-node.yaml > /dev/null
      - name: Push it to ghcr.io
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version apps/desktop/mygo.json)"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/nether-$version.tgz" oci://ghcr.io/fzn0x/charts

  clipper:
    name: Web clipper
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build its ZIPs for Chrome and Firefox, and Firefox's as an .xpi too
        run: |
          pnpm --filter @nether/clipper build
          # An .xpi is the same archive, the name Firefox installs from a file.
          for zip in apps/clipper/dist/nether-clipper-firefox-*.zip; do cp "$zip" "${zip%.zip}.xpi"; done
      - uses: actions/upload-artifact@v7
        with:
          name: release-clipper
          path: |
            apps/clipper/dist/*.zip
            apps/clipper/dist/*.xpi

  # The Android app, signed with the project's release key from the
  # repository's secrets, so each release's APK installs over the last one's,
  # with no store (#238).
  android:
    name: Android app
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Capacitor 8 builds with JDK 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Build the page and copy it into the app
        run: pnpm --filter @nether/mobile build
      - name: Build the release APK, signed with the project's key
        working-directory: apps/mobile/android
        env:
          NETHER_ANDROID_KEYSTORE: ${{ secrets.NETHER_ANDROID_KEYSTORE }}
          NETHER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NETHER_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$NETHER_ANDROID_KEYSTORE" || { echo "The release key is not in the repository's secrets."; exit 1; }
          export NETHER_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          printf '%s' "$NETHER_ANDROID_KEYSTORE" | base64 -d > "$NETHER_ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease --console=plain
          rm -f "$NETHER_ANDROID_KEYSTORE_FILE"
      - name: Check it is signed with the project's key, and name it
        run: |
          version="$(jq -r .version apps/mobile/package.json)"
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # The key's certificate, which the install guide gives too.
          grep -q "SHA-256 digest: 4d41ba9971858575ff88beac1b87d2c6958cda0f22f5b747459f903278554beb" "$RUNNER_TEMP/certs.txt" || {
            echo "The APK is not signed with the project's release key."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/android"
          cp "$apk" "$RUNNER_TEMP/android/nether-$version-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: ${{ runner.temp }}/android/

  publish:
    name: Publish
    needs: [desktop, appimage, flatpak, server, chart, clipper, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums and notes
        run: |
          version="$(jq -r .version apps/desktop/mygo.json)"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          {
            cat .github/release-notes.md | sed "s|{version}|$version|g; s|{url}|$url|g"
            echo
            echo "## What's in $version"
            echo
            # The version's section of the changelog, without its heading.
            awk -v head="## [$version]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Publish the release, the manifests last
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s extglob
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Nether $GITHUB_REF_NAME" --notes-file notes.md --latest \
            release/!(update-*.json)
          # Apps read a manifest, then download what it names: those are up first.
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release/update-*.json
