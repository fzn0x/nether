packages:
  - apps/*
  - packages/*
  - enterprise/*
  - tools/*

# Supply-chain hardening: only resolve versions that have been public for 7 days.
minimumReleaseAge: 10080

# One name for each folder in node_modules/.pnpm on every system: pnpm's
# default is 60 characters on Windows and 120 elsewhere. Capacitor writes
# these paths into the committed native projects (CapApp-SPM's Package.swift,
# capacitor.settings.gradle), so they must not change with the system.
virtualStoreDirMaxLength: 60

onlyBuiltDependencies:
  - lefthook

overrides:
  # Mermaid's ELK layout is under the EPL-2.0, which the AGPL does not allow:
  # a stand-in takes its place (ADR 0009).
  elkjs: link:./tools/stubs/elkjs

# pdf.js draws in Node with this native canvas; the app draws in the page.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
