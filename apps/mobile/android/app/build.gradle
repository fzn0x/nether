import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'app.cash.licensee'

// The app's version is the mobile package's, which a release sets with the
// others. Its code grows with each release, so a release's APK installs over
// the one before: 0.2.0 is 2000, 1.4.12 is 1004012.
def appVersion = new JsonSlurper().parse(file("../../package.json")).version as String
def versionParts = appVersion.tokenize(".-").take(3).collect { it as int }
def appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]

// The project's release key, given by CI's secrets alone; no key is ever in
// the repository. Without it a release build is unsigned, as before.
def releaseKeystore = System.getenv("NETHER_ANDROID_KEYSTORE_FILE")

android {
    namespace = "io.github.fzn0x.nether"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.fzn0x.nether"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType "pkcs12"
                storePassword System.getenv("NETHER_ANDROID_KEYSTORE_PASSWORD")
                keyAlias "nether"
                keyPassword System.getenv("NETHER_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        // Signed with the project's key when CI's secrets give it, for the APK
        // each release attaches; unsigned otherwise.
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        // As a release, signed with the SDK's debug key, its WebView open to
        // DevTools, for tools/perf/android.mjs to measure.
        perf {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// The licenses of the libraries the app ships, each on ADR 0001's list, as
// .github/scripts/licenses.mjs has it for npm; the build fails on any
// other, or on one it cannot read. A library under another license of that
// list adds it here.
licensee {
    allow('Apache-2.0')
    // SQLCipher's POM names its license by its address only: the Community
    // Edition's BSD-3-Clause, reviewed for ADR 0087.
    allowUrl('https://www.zetetic.net/sqlcipher/license/') {
        because 'SQLCipher Community Edition, BSD-3-Clause'
    }
}

apply from: 'capacitor.build.gradle'
