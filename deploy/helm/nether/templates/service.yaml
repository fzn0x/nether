apiVersion: v1
kind: Service
metadata:
  name: {{ include "nether.fullname" . }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # No affinity: any node serves any client (ADR 0082).
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "nether.selector" . | nindent 4 }}
