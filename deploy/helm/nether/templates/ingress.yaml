{{- if .Values.ingress.enabled }}
# /api/sync and /api/relay are WebSockets: give them an hour of idle time
# in your controller's annotations; the Kubernetes guide has each one's.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nether.fullname" . }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nether.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
