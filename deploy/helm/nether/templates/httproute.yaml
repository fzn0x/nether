{{- if .Values.httpRoute.enabled }}
# Gateway API (1.x): a route on a Gateway you run, with no request timeout,
# since /api/sync and /api/relay are WebSockets that stay open.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nether.fullname" . }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "nether.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
