{{- if and (eq .Values.storage.kind "disk") (not .Values.storage.disk.existingClaim) }}
# Attachments and backups; kept after an uninstall.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nether.claimName" . }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.storage.disk.accessModes | nindent 4 }}
  {{- with .Values.storage.disk.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.disk.size }}
{{- end }}
