{{- include "nether.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- /*
  The server's secrets, unless you bring a Secret of your own. Made before
  the migration Job, so it is a hook; it stays after an uninstall, since
  NETHER_SECRET_KEY opens what the database keeps sealed. A key the chart
  makes up is kept across upgrades: read back from the Secret there.
*/ -}}
{{- $name := include "nether.fullname" . -}}
{{- $keys := .Values.secrets.keys -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $kept := dict -}}
{{- range $key, $value := $existing }}{{ $_ := set $kept $key ($value | b64dec) }}{{ end -}}
{{- $values := .Values.secrets -}}
{{- $secretKey := $values.secretKey | default (get $kept $keys.secretKey) | default (randBytes 32) -}}
{{- $setupCode := $values.setupCode | default (get $kept $keys.setupCode) | default (randAlphaNum 24) -}}
{{- $databaseUrl := $values.databaseUrl -}}
{{- $redisUrl := $values.redisUrl -}}
{{- $postgresPassword := "" -}}
{{- if .Values.bundled.enabled -}}
{{- $postgresPassword = get $kept "POSTGRES_PASSWORD" | default (randAlphaNum 32) -}}
{{- $databaseUrl = $databaseUrl | default (printf "postgres://nether:%s@%s-postgres:5432/nether" $postgresPassword $name) -}}
{{- $redisUrl = $redisUrl | default (printf "redis://%s-valkey:6379" $name) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $keys.databaseUrl }}: {{ $databaseUrl | quote }}
  {{- with $redisUrl }}
  {{ $keys.redisUrl }}: {{ . | quote }}
  {{- end }}
  {{ $keys.secretKey }}: {{ $secretKey | quote }}
  {{ $keys.setupCode }}: {{ $setupCode | quote }}
  {{- with $values.s3AccessKey }}
  {{ $keys.s3AccessKey }}: {{ . | quote }}
  {{- end }}
  {{- with $values.s3SecretKey }}
  {{ $keys.s3SecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with $values.smtpUrl }}
  {{ $keys.smtpUrl }}: {{ . | quote }}
  {{- end }}
  {{- with $values.oidcClientSecret }}
  {{ $keys.oidcClientSecret }}: {{ . | quote }}
  {{- end }}
  {{- if .Values.bundled.enabled }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  {{- end }}
{{- end }}
