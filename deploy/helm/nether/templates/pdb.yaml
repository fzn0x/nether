{{- if and .Values.podDisruptionBudget.enabled (or .Values.autoscaling.enabled (gt (int (include "nether.replicas" .)) 1)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nether.fullname" . }}
  labels:
    {{- include "nether.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "nether.selector" . | nindent 6 }}
{{- end }}
