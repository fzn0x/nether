# One node on your own PostgreSQL, attachments on a volume. The Secret
# `nether-secrets` holds NETHER_DATABASE_URL, as
#   kubectl create secret generic nether-secrets \
#     --from-literal=NETHER_DATABASE_URL=postgres://nether:<password>@postgres:5432/nether \
#     --from-literal=NETHER_SECRET_KEY="$(openssl rand -base64 32)" \
#     --from-literal=NETHER_SETUP_CODE="$(openssl rand -hex 12)"
secrets:
  existingSecret: nether-secrets
server:
  publicUrl: https://nether.example.org
  trustProxy: uniquelocal
ingress:
  enabled: true
  className: nginx
  annotations:
    # WebSockets at /api/sync and /api/relay stay open an hour.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
  hosts:
    - host: nether.example.org
  tls:
    - secretName: nether-tls
      hosts: [nether.example.org]
