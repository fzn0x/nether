# The test directory's configuration: dc=example,dc=org on mdb, with
# memberOf kept on each group's members and member kept when an entry is
# renamed or removed. Pages hold 1,000 entries at most, as Active
# Directory's MaxPageSize, and a paged search may read any number of them.
include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /etc/openldap/schema/nis.schema

modulepath /usr/lib/openldap
moduleload back_mdb.so
moduleload memberof.so
moduleload refint.so

TLSCACertificateFile /certs/ca.pem
TLSCertificateFile /certs/server.pem
TLSCertificateKeyFile /certs/server.key

sizelimit size.soft=1000 size.hard=1000 size.pr=1000 size.prtotal=unlimited

database mdb
suffix "dc=example,dc=org"
rootdn "cn=admin,dc=example,dc=org"
include /certs/rootpw.conf
directory /var/lib/openldap/data

access to attrs=userPassword
  by self write
  by anonymous auth
  by * none
access to *
  by users read
  by * none

overlay memberof
overlay refint
refint_attributes member
